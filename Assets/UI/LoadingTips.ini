Title = GPS Scrambler
Author = bl9rTV Community
Command = Command_GPSScrambler
RelatedObject = GLAVehicleQuadCannon
Advice = GPS Scrambler can cloak most ground units, but Angry Mobs, Bomb Trucks, and units with their own stealth capability are excluded. Aircraft cannot be cloaked, even while grounded, with one exception: the Air Force General's Comanches can receive GPS stealth while on the ground, provided their Stealth Comanche upgrade has not been purchased.

